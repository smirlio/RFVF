<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Rosso Fuoco e Verde Foglia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --row-even: #181818;
      --row-border: #2a2a2a;
      --name-color: #ffffff;
      --lvl-bg: #2a2d32;
      --lvl-border: #3a3f47;
      --lvl-color: #e0e0e0;
    }

    body.light-mode {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --card-bg: #f5f5f5;
      --border-color: #cccccc;
      --row-even: #ededed;
      --row-border: #e0e0e0;
      --name-color: #000000;
      --lvl-bg: #e2e8f0;
      --lvl-border: #cbd5e1;
      --lvl-color: #1e293b;
    }

    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 12px; transition: background 0.3s, color 0.3s; }
    
    /* Lock Screen */
    #lock-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-color); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 999;
    }
    #lock-screen input { padding: 10px; font-size: 18px; text-align: center; border-radius: 6px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); margin-bottom: 10px; }
    #lock-screen button { padding: 10px 20px; font-size: 16px; background: #cb0000; color: #fff; border: none; border-radius: 6px; cursor: pointer; }

    /* Main UI */
    .app-header { text-align: center; margin-bottom: 15px; }
    .app-header h1 { color: #ffcc00; font-size: 24px; text-transform: uppercase; margin: 0 0 10px 0; }
    
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; }
    .search-input, .type-select {
      padding: 8px 12px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-color); font-size: 16px;
    }
    .search-input { flex: 1; min-width: 180px; }
    .type-select { width: 140px; }

    table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 6px; overflow: hidden; }
    th { background: #cb0000; color: #fff; padding: 10px 8px; font-size: 13px; text-transform: uppercase; text-align: left; }
    td { padding: 8px; border-bottom: 1px solid var(--row-border); font-size: 13px; vertical-align: middle; }
    tr:nth-child(even) { background: var(--row-even); }

    .pkmn-name { font-weight: bold; color: var(--name-color); font-size: 14px; display: block; margin-bottom: 2px; }
    .type-badge { font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 3px; color: #fff; margin-right: 2px; display: inline-block; }
    
    .tag { 
      display: inline-block; 
      padding: 3px 6px; 
      border-radius: 4px; 
      font-size: 11px; 
      font-weight: bold; 
      margin: 1px; 
      white-space: nowrap; 
      color: #ffffff; 
      text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.7); 
    }

    .tutor-tag {
      border: 1.5px dashed #ffffff;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    #theme-toggle {
      padding: 8px 12px;
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    #pokedex-body td {
  vertical-align: middle;
  padding: 6px 8px;
}

#pokedex-body td:nth-child(2) {
  width: 56px;
  text-align: center;
}

#pokedex-body img {
  image-rendering: pixelated;
  display: block;
  margin: 0 auto;
}
  </style>
</head>
<body>

  <!-- Schermata di blocco con PIN -->
  <div id="lock-screen">
    <h2 style="color:#ffcc00;">Guida completa Rosso Fuoco e Verde Foglia</h2>
    <input type="password" id="pin-input" placeholder="Inserisci PIN (default: 1234)">
    <button onclick="checkPin()">Sblocca</button>
  </div>

  <div id="app-content" style="display:none;">
    <div class="app-header">
      <h1>Pokédex di Kanto</h1>
    </div>

    <div class="filter-bar">
      <input type="text" id="search" class="search-input" placeholder="Cerca Pokémon o Mossa..." oninput="renderTable()">
      <select id="type-filter" class="type-select" onchange="renderTable()">
        <option value="">Tutti i Tipi</option>
      </select>
      <button id="theme-toggle">☀️ Light Mode</button>
      <a href="https://drive.google.com/file/d/1Rbj1qFU_6WqZBckz0FPQQX9aLMgVvrBs/view?usp=sharing" target="_blank" style="padding: 8px 12px; background: #cb0000; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: bold; white-space: nowrap; display: inline-flex; align-items: center;">Apri Guida PDF</a>
      <a href="mt.html" style="padding: 8px 12px; background: #3b4cca; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: bold; white-space: nowrap; display: inline-flex; align-items: center;">Lista MT</a>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width: 40px;">ID</th>
          <th style="width: 40px;"></th>
          <th style="width: 100px;">Pokémon</th>
          <th>Mosse Livello</th>
          <th>Mosse MT / MN / Tutor</th>
        </tr>
      </thead>
      <tbody id="pokedex-body"></tbody>
    </table>
  </div>

<script>
    const MY_PIN = "1234";
    
    const TYPE_COLORS = {
      'Normale': '#A8A878', 'Fuoco': '#F08030', 'Acqua': '#6890F0', 'Erba': '#78C850',
      'Elettro': '#F8D030', 'Ghiaccio': '#98D8D8', 'Lotta': '#C03028', 'Veleno': '#A040A0',
      'Terra': '#E0C068', 'Volante': '#A890F0', 'Psico': '#F85888', 'Coleottero': '#A8B820',
      'Roccia': '#B8A038', 'Spettro': '#705898', 'Drago': '#7038F8', 'Acciaio': '#B8B8D0', 'Buio': '#705848'
    };

// Dizionario aggiornato con le mosse mancanti
    const MOVES_DATABASE = {
      // PSICO
      'psichico': 'Psico', 'riposo': 'Psico', 'mangiasogni': 'Psico', 'calmamente': 'Psico',
      'baratto': 'Psico', 'schermoluce': 'Psico', 'riflesso': 'Psico', 'teletrasporto': 'Psico',
      'confusione': 'Psico', 'cinèsi': 'Psico', 'cinesi': 'Psico', 'amnesia': 'Psico', 'giocodiruolo': 'Psico',
      'psicoraggio': 'Psico', 'cometpugno': 'Psico', 'ipnosi': 'Psico', 'barriera': 'Psico',
      'meditazione': 'Psico', 'divinazione': 'Psico', 'agilità': 'Psico', 'psicamisù': 'Normale',
      'specchiovelo': 'Psico',

      // LOTTA
      'contrattacco': 'Lotta', 'movim. sismico': 'Lotta', 'calciorullo': 'Lotta', 'centripugno': 'Lotta',
      'breccia': 'Lotta', 'granfisico': 'Lotta', 'spaccaroccia': 'Lotta', 'sottomissione': 'Lotta',
      'colpo basso': 'Lotta', 'incrocolpo': 'Lotta', 'calciosalto': 'Lotta', 'dinamipugno': 'Lotta',
      'pugnorapido': 'Lotta', 'calciovolante': 'Lotta', 'triplocalcio': 'Lotta', 'colpokarate': 'Lotta',
      'doppiocalcio': 'Lotta', 'individua': 'Lotta', 'vitaltiro': 'Lotta',

      // ROCCIA
      'forzantica': 'Roccia', 'frana': 'Roccia', 'terrempesta': 'Roccia', 'rocciotomba': 'Roccia',
      'rotolamento': 'Roccia', 'sassata': 'Roccia', 'cadutamassi': 'Roccia', 'ruotafangosa': 'Roccia',

      // TERRA
      'terremoto': 'Terra', 'fossa': 'Terra', 'ossoclava': 'Terra', 'fangata': 'Terra',
      'turbosabbia': 'Terra', 'magnitudo': 'Terra', 'abisso': 'Terra', 'colpodifango': 'Terra',
      'ossomerang': 'Terra', 'ossoraffica': 'Terra', 'sabbiotomba': 'Terra', 'fangosberla': 'Terra',

      // FUOCO
      'lanciafiamme': 'Fuoco', 'fuocobomba': 'Fuoco', 'giornodisole': 'Fuoco', 'vampata': 'Fuoco',
      'braciere': 'Fuoco', 'ruotafuoco': 'Fuoco', 'fuocopugno': 'Fuoco', 'ruotafuoco': 'Fuoco',
      'turbofuoco': 'Fuoco', 'ondacalda': 'Fuoco',

      // ACQUA
      'surf': 'Acqua', 'cascata': 'Acqua', 'pioggiadanza': 'Acqua', 'sub': 'Acqua', 'idropulsar': 'Acqua',
      'pistolacqua': 'Acqua', 'idropompa': 'Acqua', 'bolla': 'Acqua', 'ritirata': 'Acqua',
      'mulinello': 'Acqua', 'bollaraggio': 'Acqua', 'docciascudo': 'Acqua', 'martellata': 'Acqua', 'tenaglia': 'Acqua',

      // ERBA
      'solarraggio': 'Erba', 'gigassorbimento': 'Erba', 'semitraglia': 'Erba', 'parassiseme': 'Erba',
      'frustata': 'Erba', 'sonnifero': 'Erba', 'foglielama': 'Erba', 'sintesi': 'Erba',
      'parassita': 'Erba', 'fogliamagica': 'Erba', 'radicalbero': 'Erba', 'assorbimento': 'Erba',
      'paralizzante': 'Erba', 'petalodanza': 'Erba', 'paraliz spora': 'Erba', 'spora': 'Erba',
      'megassorbimento': 'Erba', 'aromaterapia': 'Erba',

      // ELETTRO
      'tuononda': 'Elettro', 'fulmine': 'Elettro', 'tuono': 'Elettro', 'ondashock': 'Elettro',
      'tuonopugno': 'Elettro', 'tuonoshock': 'Elettro', 'sottocarica': 'Elettro', 'scintilla': 'Elettro', 'falcecannone': 'Elettro',

      // GHIACCIO
      'geloraggio': 'Ghiaccio', 'bora': 'Ghiaccio', 'grandine': 'Ghiaccio', 'raggiaurora': 'Ghiaccio',
      'nube': 'Ghiaccio', 'gelopugno': 'Ghiaccio', 'ventogelato': 'Ghiaccio', 'purogelo': 'Ghiaccio',
      'polneve': 'Ghiaccio', 'nebbia': 'Ghiaccio',

      // VELENO
      'tossina': 'Veleno', 'fangobomba': 'Veleno', 'velenpolvere': 'Veleno', 'acido': 'Veleno',
      'velendenti': 'Veleno', 'fango': 'Veleno', 'smog': 'Veleno', 'velenoshock': 'Veleno',
      'velenospina': 'Veleno', 'velenodenti': 'Veleno', 'scudo acido': 'Veleno', 'velenogas': 'Veleno',

      // SPETTRO
      'palla ombra': 'Spettro', 'maledizione': 'Spettro', 'leccata': 'Spettro', 'ombra notturna': 'Spettro',
      'stordiraggio': 'Spettro', 'destinobbligato': 'Spettro', 'incubo': 'Spettro', 'dispetto': 'Spettro',
      'pugnodombra': 'Spettro', 'sgomento': 'Spettro',

      // BUIO
      'morsura': 'Buio', 'morso': 'Buio', 'sgranocchio': 'Buio', 'furto': 'Buio', 'scippo': 'Buio',
      'provocazione': 'Buio', 'inseguimento': 'Buio', 'finta': 'Buio', 'garanzia': 'Buio',
      'vendetta': 'Buio', 'falselacrime': 'Buio', 'privazione': 'Buio',

      // VOLANTE
      'volo': 'Volante', 'aeroassalto': 'Volante', 'raffica': 'Volante', 'beccata': 'Volante',
      'aereocolpo': 'Volante', 'attacco d ala': 'Volante', 'aeroattacco': 'Volante',
      'perforbecco': 'Volante', 'danzadipiume': 'Volante', 'aerasoio': 'Volante', 'speculmossa': 'Volante', 'Rimbalzo': 'Volante',

      // COLEOTTERO
      'tagliofuria': 'Coleottero', 'megacorno': 'Coleottero', 'tagliodoppio': 'Coleottero',
      'furia': 'Coleottero', 'turbine': 'Coleottero', 'ventargenteo': 'Coleottero', 'missilspillo': 'Coleottero',
      'doppio ago': 'Coleottero', 'millebave': 'Coleottero', 'sanguisuga': 'Coleottero',

      // ACCIAIO
      'alacciaio': 'Acciaio', 'ferrostrido': 'Acciaio', 'ferrartigli': 'Acciaio', 'metalcoppia': 'Acciaio',
      'meteor pugno': 'Acciaio', 'ferromuro': 'Acciaio', 'codacciaio': 'Acciaio', 'bombacciaio': 'Acciaio',

      // DRAGO
      'dragartigli': 'Drago', 'dragofuria': 'Drago', 'oltraggio': 'Drago', 'ira di drago': 'Drago',
      'dragodanza': 'Drago', 'tornado': 'Drago',

      // NORMALE
      'botta': 'Normale', 'trasformazione': 'Normale', 'megapugno': 'Normale', 'metronomo': 'Normale',
      'danzaspada': 'Normale', 'megacalcio': 'Normale', 'corposcontro': 'Normale', 'sdoppiatore': 'Normale',
      'mimica': 'Normale', 'covauova': 'Normale', 'esplosione': 'Normale', 'sostituto': 'Normale',
      'taglio': 'Normale', 'boato': 'Normale', 'iper raggio': 'Normale', 'forza': 'Normale',
      'doppioteam': 'Normale', 'flash': 'Normale', 'protezione': 'Normale', 'attrazione': 'Normale',
      'ritorno': 'Normale', 'frustrazione': 'Normale', 'salvaguardia': 'Normale', 'introforza': 'Normale',
      'attaccalite': 'Normale', 'facciata': 'Normale', 'forzasegreta': 'Normale', 'ruggito': 'Normale',
      'profumino': 'Normale', 'crescita': 'Erba', 'autodistruzione': 'Normale', 'attacco rapido': 'Normale',
      'pazienza': 'Normale', 'muro di fumo': 'Normale', 'stridio': 'Normale', 'azione': 'Normale'
    };

    let pokedexData = [];

    function checkPin() {
      const input = document.getElementById('pin-input').value;
      if (input === MY_PIN) {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        setupThemeToggle();
        loadData();
      } else {
        alert("PIN Errato!");
      }
    }

    async function loadData() {
      try {
        const res = await fetch('pokedex.json');
        pokedexData = await res.json();
        populateTypeFilter();
        renderTable();
      } catch (err) {
        console.error("Errore caricamento pokedex.json:", err);
      }
    }

    function populateTypeFilter() {
      const select = document.getElementById('type-filter');
      select.innerHTML = '<option value="">Tutti i Tipi</option>';
      Object.keys(TYPE_COLORS).forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
      });
    }

  function createMoveTag(moveName, label = '', isTutor = false) {
      const cleanName = moveName.trim();
      
      // Rimuove apostrofi (dritti e curvi) e doppi spazi per un match perfetto
      const lookupKey = cleanName.toLowerCase()
        .replace(/['’]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      
      const moveType = MOVES_DATABASE[lookupKey] || 'Normale';
      const color = TYPE_COLORS[moveType] || '#A8A878';
      const text = label ? `<b style="color:#ffcc00">${label}</b> ${cleanName}` : cleanName;
      const extraClass = isTutor ? ' tutor-tag' : '';
      
      return `<span class="tag${extraClass}" style="background-color: ${color};">${text}</span>`;
    }
    function formatMovesLvl(str) {
      if (!str || str === '-') return '-';
      return str.split(' | ').map(m => {
        const parts = m.split(' ');
        const lvl = parts[0] + (parts[1] ? ' ' + parts[1] : '');
        const name = m.substring(lvl.length).trim();
        return createMoveTag(name, lvl, false);
      }).join(' ');
    }

    function formatMovesTM(str) {
      if (!str || str === '-') return '-';
      return str.split(' | ').map(m => {
        const isTutor = m.includes('(Tutor)');
        const cleanName = m.replace(' (Tutor)', '').trim();
        return createMoveTag(cleanName, '', isTutor);
      }).join(' ');
    }

    function renderTable() {
      const search = document.getElementById('search').value.toLowerCase();
      const typeFilter = document.getElementById('type-filter').value;
      const tbody = document.getElementById('pokedex-body');
      tbody.innerHTML = '';

      pokedexData.filter(p => {
        const matchName = p.nome.toLowerCase().includes(search);
        const matchMoveLvl = p.mosse_lvl.toLowerCase().includes(search);
        const matchMoveTM = p.mosse_tm.toLowerCase().includes(search);
        const matchType = typeFilter === "" || p.tipi.includes(typeFilter);
        return (matchName || matchMoveLvl || matchMoveTM) && matchType;
      }).forEach(p => {
        const tiposHtml = p.tipi.map(t => `<span class="type-badge" style="background:${TYPE_COLORS[t] || '#68A090'}">${t.toUpperCase()}</span>`).join('');
        const imgUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iii/firered-leafgreen/${p.id}.png`;

        tbody.innerHTML += `
          <tr>
            <td style="color:#888; font-weight:bold; text-align:center;">#${String(p.id).padStart(3, '0')}</td>
            <td><img src="${imgUrl}" width="48" height="48" style="image-rendering:pixelated;"></td>
            <td>
              <span class="pkmn-name">${p.nome}</span>
              <div>${tiposHtml}</div>
            </td>
            <td>${formatMovesLvl(p.mosse_lvl)}</td>
            <td>${formatMovesTM(p.mosse_tm)}</td>
          </tr>
        `;
      });
    }

    function setupThemeToggle() {
      const toggleBtn = document.getElementById('theme-toggle');
      if (!toggleBtn) return;

      if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-mode');
        toggleBtn.textContent = '🌙 Dark Mode';
      }

      toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        toggleBtn.textContent = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
      });
    }
  </script>
</body>
</html>
