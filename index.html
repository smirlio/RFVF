<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <button id="theme-toggle">☀️ Light Mode</button>
  <title>Pokémon Rosso Fuoco e Verde Foglia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
  :root {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --border-color: #333333;
    --row-even: #181818;
    --row-border: #2a2a2a;
    --name-color: #ffffff;
    --lvl-bg: #2a2d32;
    --lvl-border: #3a3f47;
    --lvl-color: #e0e0e0;
  }

  body.light-mode {
    --bg-color: #ffffff;
    --text-color: #1a1a1a;
    --card-bg: #f5f5f5;
    --border-color: #cccccc;
    --row-even: #ededed;
    --row-border: #e0e0e0;
    --name-color: #000000;
    --lvl-bg: #e2e8f0;
    --lvl-border: #cbd5e1;
    --lvl-color: #1e293b;
  }

  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 12px; transition: background 0.3s, color 0.3s; }
  
  /* Lock Screen */
  #lock-screen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: var(--bg-color); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 999;
  }
  #lock-screen input { padding: 10px; font-size: 18px; text-align: center; border-radius: 6px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); margin-bottom: 10px; } /* <-- Ingrandito (era 16px) */
  #lock-screen button { padding: 10px 20px; font-size: 16px; background: #cb0000; color: #fff; border: none; border-radius: 6px; cursor: pointer; } /* <-- Ingrandito (era 14px) */

  /* Main UI */
  .app-header { text-align: center; margin-bottom: 15px; }
  .app-header h1 { color: #ffcc00; font-size: 24px; text-transform: uppercase; margin: 0 0 10px 0; } /* <-- Ingrandito (era 20px) */
  
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
  .search-input, .type-select {
    padding: 8px 12px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-color); font-size: 16px; /* <-- Ingrandito (era 14px) */
  }
  .search-input { flex: 1; min-width: 180px; }
  .type-select { width: 140px; }

  table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 6px; overflow: hidden; }
  th { background: #cb0000; color: #fff; padding: 10px 8px; font-size: 13px; text-transform: uppercase; text-align: left; } /* <-- Ingrandito (era 11px) */
  td { padding: 8px; border-bottom: 1px solid var(--row-border); font-size: 13px; vertical-align: middle; } /* <-- Ingrandito (era 11px) */
  tr:nth-child(even) { background: var(--row-even); }

  .pkmn-name { font-weight: bold; color: var(--name-color); font-size: 14px; display: block; margin-bottom: 2px; } /* <-- Ingrandito */
  .type-badge { font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 3px; color: #fff; margin-right: 2px; display: inline-block; } /* <-- Ingrandito (era 8px) */
  .tag { display: inline-block; padding: 3px 5px; border-radius: 3px; font-size: 11px; margin: 1px; white-space: nowrap; } /* <-- Ingrandito (era 9px) */
  .lvl-tag { background: var(--lvl-bg); border: 1px solid var(--lvl-border); color: var(--lvl-color); }
  .tm-tag { background: #1e3a5f; color: #9bbdff; border: 1px solid #2b5288; }
  .tutor-tag { background: #3b1e5f; color: #d8b4fe; border: 1px solid #572b88; }
</style>
</head>
<body>

  <!-- Schermata di blocco con PIN -->
  <div id="lock-screen">
    <h2 style="color:#ffcc00;">Guida completa Rosso Fuoco e Verde Foglia</h2>
    <input type="password" id="pin-input" placeholder="Inserisci PIN (default: 1234)">
    <button onclick="checkPin()">Sblocca</button>
  </div>

  <div id="app-content" style="display:none;">
    <div class="app-header">
      <h1>Pokédex di Kanto</h1>
    </div>

<div class="filter-bar">
  <input type="text" id="search" class="search-input" placeholder="Cerca Pokémon o Mossa..." oninput="renderTable()">
  <select id="type-filter" class="type-select" onchange="renderTable()">
    <option value="">Tutti i Tipi</option>
  </select>
  <a href="https://drive.google.com/file/d/1Rbj1qFU_6WqZBckz0FPQQX9aLMgVvrBs/view?usp=sharing" target="_blank" style="padding: 8px 12px; background: #cb0000; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: bold; white-space: nowrap; display: inline-flex; align-items: center;">Apri Guida PDF</a>
  <a href="mt.html" style="padding: 8px 12px; background: #3b4cca; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: bold; white-space: nowrap; display: inline-flex; align-items: center;">Lista MT</a>
</div>

    <table>
      <thead>
        <tr>
          <th style="width: 40px;">ID</th>
          <th style="width: 40px;"></th>
          <th style="width: 100px;">Pokémon</th>
          <th>Mosse Livello</th>
          <th>Mosse MT / MN / Tutor</th>
        </tr>
      </thead>
      <tbody id="pokedex-body"></tbody>
    </table>
  </div>

  <script>
    const MY_PIN = "1234"; // Puoi cambiare qui il tuo PIN privato
    const TYPE_COLORS = {
      'Normale':'#A8A878','Fuoco':'#F08030','Acqua':'#6890F0','Erba':'#78C850',
      'Elettro':'#F8D030','Ghiaccio':'#98D8D8','Lotta':'#C03028','Veleno':'#A040A0',
      'Terra':'#E0C068','Volante':'#A890F0','Psico':'#F85888','Coleottero':'#A8B820',
      'Roccia':'#B8A038','Spettro':'#705898','Drago':'#7038E8','Acciaio':'#B8B8D0','Buio':'#705848'
    };

    let pokedexData = [];

    function checkPin() {
      const input = document.getElementById('pin-input').value;
      if (input === MY_PIN) {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        loadData();
      } else {
        alert("PIN Errato!");
      }
    }

    async function loadData() {
      const res = await fetch('pokedex.json');
      pokedexData = await res.json();
      populateTypeFilter();
      renderTable();
    }

    function populateTypeFilter() {
      const select = document.getElementById('type-filter');
      Object.keys(TYPE_COLORS).forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
      });
    }

    function formatMovesLvl(str) {
      if (!str || str === '-') return '-';
      return str.split(' | ').map(m => {
        const [lvl, name] = m.split(' ', 2);
        return `<span class="tag lvl-tag"><b style="color:#ffcc00">${lvl}</b> ${m.substring(lvl.length+1)}</span>`;
      }).join(' ');
    }

    function formatMovesTM(str) {
      if (!str || str === '-') return '-';
      return str.split(' | ').map(m => {
        if (m.includes('(Tutor)')) {
          return `<span class="tag tutor-tag">${m.replace(' (Tutor)', '')}</span>`;
        }
        return `<span class="tag tm-tag">${m}</span>`;
      }).join(' ');
    }

    function renderTable() {
      const search = document.getElementById('search').value.toLowerCase();
      const typeFilter = document.getElementById('type-filter').value;
      const tbody = document.getElementById('pokedex-body');
      tbody.innerHTML = '';

      pokedexData.filter(p => {
        const matchName = p.nome.toLowerCase().includes(search);
        const matchMoveLvl = p.mosse_lvl.toLowerCase().includes(search);
        const matchMoveTM = p.mosse_tm.toLowerCase().includes(search);
        const matchType = typeFilter === "" || p.tipi.includes(typeFilter);
        return (matchName || matchMoveLvl || matchMoveTM) && matchType;
      }).forEach(p => {
        const tiposHtml = p.tipi.map(t => `<span class="type-badge" style="background:${TYPE_COLORS[t] || '#68A090'}">${t.toUpperCase()}</span>`).join('');
        const imgUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iii/firered-leafgreen/${p.id}.png`;

        tbody.innerHTML += `
          <tr>
            <td style="color:#888; font-weight:bold; text-align:center;">#${String(p.id).padStart(3, '0')}</td>
            <td><img src="${imgUrl}" width="32" height="32" style="image-rendering:pixelated;"></td>
            <td>
              <span class="pkmn-name">${p.nome}</span>
              <div>${tiposHtml}</div>
            </td>
            <td>${formatMovesLvl(p.mosse_lvl)}</td>
            <td>${formatMovesTM(p.mosse_tm)}</td>
          </tr>
        `;
      });
    }
  </script>
  <script>
    const toggleBtn = document.getElementById('theme-toggle');

    // Mantiene la preferenza salvata nel browser
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-mode');
      if (toggleBtn) toggleBtn.textContent = '🌙 Dark Mode';
    }

    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        toggleBtn.textContent = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
      });
    }
  </script>
</body>
</html>
